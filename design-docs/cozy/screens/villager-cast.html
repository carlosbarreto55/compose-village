<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: "tom", n: 0, tick: 0 };
  }

  componentDidMount() {
    this.timer = setInterval(() => this.step(), 40);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  cast() {
    return [
      { id: "rosa", name: "Rosa", job: "Baker", line: "Good morning! Smell that? Fresh bread, right out of the oven. Now my bakery just needs a sign." },
      { id: "tom", name: "Tom", job: "Florist", line: "Oh, hi! You must be the new sign maker. I'm Tom, I run the flower shop next to Rosa's bakery." },
      { id: "marco", name: "Marco", job: "Chef", line: "Benvenuto! My whole menu lives in my head. Can you help me put it up on the wall?" },
      { id: "lucia", name: "Dona Lúcia", job: "Teacher", line: "Good afternoon, dear. The school contest is tomorrow, and our scoreboard is still blank." },
      { id: "iara", name: "Iara", job: "Boat captain", line: "Ahoy! The ferry always leaves on time. The trouble is, nobody knows when that is." }
    ];
  }

  speaking() {
    const who = this.state.who;
    return this.cast().find((v) => v.id === who);
  }

  step() {
    const s = this.state;
    const full = this.speaking().line;
    const cps = this.props.speed ?? 40;
    const n = this.props.reducedMotion ? full.length : Math.min(full.length, s.n + cps * 0.04);
    this.setState({ n: n, tick: s.tick + 1 });
  }

  renderVals() {
    const s = this.state;
    const reduced = !!this.props.reducedMotion;
    const speaker = this.speaking();
    const typing = s.n < speaker.line.length;
    const vals = {};
    this.cast().forEach((v, i) => {
      const talking = v.id === s.who && typing && !reduced && Math.floor(s.tick / 3) % 2 === 0;
      const blinking = !reduced && (s.tick + i * 17) % 90 < 3;
      vals[v.id] = {
        border: v.id === s.who ? "#7A4E2D" : "#E2D3BC",
        mouthOpen: talking ? 1 : 0,
        mouthClosed: talking ? 0 : 1,
        eyesOpen: blinking ? 0 : 1,
        eyesClosed: blinking ? 1 : 0,
        bob: talking ? -4 : 0,
        talk: () => this.setState({ who: v.id, n: 0 })
      };
    });
    vals.speaker = speaker.name;
    vals.speakerJob = speaker.job;
    vals.shown = speaker.line.slice(0, Math.floor(s.n));
    vals.done = !typing;
    vals.arrowOpacity = reduced || s.tick % 20 < 12 ? 1 : 0.3;
    vals.finish = () => this.setState({ n: speaker.line.length });
    return vals;
  }
}

mountDC(Component, {"speed": 40, "reducedMotion": false});
</script>
</body>
</html>
