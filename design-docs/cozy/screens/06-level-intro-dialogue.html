<rect x="88" y="140" width="24" height="32" rx="8" fill="#D9A27A"></rect>
<circle cx="52" cy="106" r="10" fill="#E8B48A"></circle><circle cx="148" cy="106" r="10" fill="#E8B48A"></circle>

<path d="M46 92 Q100 4 154 92 Q100 70 46 92 Z" fill="#4E7A3A"></path>

<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { intro: true, page: 0, n: 0, tick: 0 };
  }

  componentDidMount() {
    this.timer = setInterval(() => this.step(), 40);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  pages() {
    return [
      "Oh, hi! You must be the new sign maker. I'm Tom, I run the flower shop next to Rosa's bakery.",
      "Can you make my shop sign? Put “Tom's Flowers” with an “Order” button to the right of it.",
      "When someone presses Order, print “New order!” so I hear the bell. Ding!",
      "My sketch is up on the sign board. Press Run whenever you want me to take a look!"
    ];
  }

  step() {
    const s = this.state;
    if (!s.intro) return;
    const full = this.pages()[s.page];
    const cps = this.props.speed ?? 40;
    const n = this.props.reducedMotion ? full.length : Math.min(full.length, s.n + cps * 0.04);
    this.setState({ n: n, tick: s.tick + 1 });
  }

  advance() {
    const s = this.state;
    const pages = this.pages();
    if (s.n < pages[s.page].length) {
      this.setState({ n: pages[s.page].length });
    } else if (s.page < pages.length - 1) {
      this.setState({ page: s.page + 1, n: 0 });
    }
  }

  renderVals() {
    const s = this.state;
    const pages = this.pages();
    const full = pages[s.page];
    const reduced = !!this.props.reducedMotion;
    const typing = s.n < full.length;
    const isLast = s.page === pages.length - 1;
    const talking = typing && !reduced && Math.floor(s.tick / 3) % 2 === 0;
    const blinking = !reduced && s.tick % 90 < 3;
    return {
      intro: s.intro,
      shown: full.slice(0, Math.floor(s.n)),
      mouthOpen: talking ? 1 : 0,
      mouthClosed: talking ? 0 : 1,
      eyesOpen: blinking ? 0 : 1,
      eyesClosed: blinking ? 1 : 0,
      bob: talking ? -4 : 0,
      showArrow: !typing && !isLast,
      arrowOpacity: reduced || s.tick % 20 < 12 ? 1 : 0.3,
      showCta: !typing && isLast,
      pageLabel: (s.page + 1) + " of " + pages.length,
      advance: () => this.advance(),
      close: () => this.setState({ intro: false }),
      replay: () => this.setState({ intro: true, page: 0, n: 0 })
    };
  }
}

mountDC(Component, {"speed": 40, "reducedMotion": false});
</script>
