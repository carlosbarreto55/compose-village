<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: "idle", runs: 0, result: "none", n: 0, page: 0, tick: 0, buildT: 0 };
  }

  componentDidMount() {
    this.timer = setInterval(() => this.step(), 40);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
  }

  failLine() {
    return "The sign looks lovely! But a customer pressed Order and my bell stayed quiet…";
  }

  bigLines() {
    return ["Ding! Ding! There's my bell!", "It looks wonderful. Thank you — the shop is open!"];
  }

  currentLine() {
    const s = this.state;
    if (s.phase === "reacting") return this.failLine();
    if (s.phase === "celebrating") return this.bigLines()[s.page];
    return "";
  }

  step() {
    const s = this.state;
    const next = { tick: s.tick + 1 };
    if (s.phase === "building") {
      next.buildT = s.buildT + 40;
      if (next.buildT >= 720) {
        const result = s.runs >= 2 ? "complete" : "fail";
        next.result = result;
        next.phase = result === "fail" ? "reacting" : "celebrating";
        next.n = 0;
        next.page = 0;
      }
    } else if (s.phase === "reacting" || s.phase === "celebrating") {
      const full = this.currentLine();
      const cps = this.props.speed ?? 40;
      next.n = this.props.reducedMotion ? full.length : Math.min(full.length, s.n + cps * 0.04);
    }
    this.setState(next);
  }

  run() {
    const s = this.state;
    if (s.phase === "building" || s.phase === "celebrating") return;
    this.setState({ phase: "building", runs: s.runs + 1, buildT: 0, n: 0, page: 0 });
  }

  advance() {
    const s = this.state;
    const lines = this.bigLines();
    if (s.n < lines[s.page].length) {
      this.setState({ n: lines[s.page].length });
    } else if (s.page < lines.length - 1) {
      this.setState({ page: s.page + 1, n: 0 });
    }
  }

  renderVals() {
    const s = this.state;
    const reduced = !!this.props.reducedMotion;
    const flap = !reduced && Math.floor(s.tick / 3) % 2 === 0;
    const blinking = !reduced && s.tick % 90 < 3;
    const building = s.phase === "building";
    const result = s.result;

    const failLine = this.failLine();
    const smallTyping = s.phase === "reacting" && s.n < failLine.length;
    const smallTalk = smallTyping && flap;

    const lines = this.bigLines();
    const bigLine = lines[s.page];
    const bigTyping = s.phase === "celebrating" && s.n < bigLine.length;
    const bigTalk = bigTyping && flap;
    const isLast = s.page === lines.length - 1;

    const happy = result === "complete";
    const puzzled = result === "fail";
    const texts = ["The text “Tom's Flowers” is on the sign", "There is an “Order” button", "“Order” sits to the right of “Tom's Flowers”", "Pressing “Order” prints “New order!”"];
    const checks = texts.map((text, i) => {
      const state = result === "none" ? "empty" : (result === "fail" && i === 3 ? "fail" : "pass");
      const fail = state === "fail";
      return {
        text: text,
        isEmpty: state === "empty",
        isPass: state === "pass",
        isFail: fail,
        pad: fail ? "12px 14px" : "0",
        bg: fail ? "#F8E3DC" : "transparent",
        border: fail ? "#E8BFB1" : "transparent",
        weight: fail ? 700 : 400,
        color: fail ? "#7E2E1C" : "#2B2118"
      };
    });

    return {
      run: () => this.run(),
      runLabel: s.runs === 0 ? "Run" : "Run again",
      runDisabled: building || s.phase === "celebrating",
      status: building ? "Building…" : (s.runs === 0 ? "Compiler ready" : "Built in 412 ms"),
      buildPct: building ? Math.min(100, s.buildT / 720 * 100) : 0,

      smallBob: smallTalk ? -3 : 0,
      eyesNormal: !happy && !blinking ? 1 : 0,
      eyesBlink: !happy && blinking ? 1 : 0,
      eyesHappy: happy ? 1 : 0,
      browPuzzled: puzzled ? 1 : 0,
      smallMouthOpen: smallTalk ? 1 : 0,
      mouthNeutral: !smallTalk && result === "none" ? 1 : 0,
      mouthPuzzled: !smallTalk && puzzled ? 1 : 0,
      mouthHappy: !smallTalk && happy ? 1 : 0,

      showBubble: s.phase === "reacting" || s.phase === "done",
      bubbleText: s.phase === "done" ? lines[1] : failLine.slice(0, Math.floor(s.n)),
      bubbleBorder: happy ? "#BFDCC6" : "#E2D3BC",

      codeBroken: s.runs < 2,
      codeFixed: s.runs >= 2,
      line9Band: puzzled && !building ? "#4A2E25" : "transparent",
      editorNote: puzzled && !building ? "Compiles fine — line 9 is where Tom's bell should ring" : "No problems",

      done: s.phase === "done",
      replay: () => this.setState({ phase: "idle", runs: 0, result: "none", n: 0, page: 0, buildT: 0 }),
      signShadow: s.phase === "done" ? "inset 0 0 0 2px #5A3820, 0 0 0 6px #F7DFA3, 0 0 40px 10px rgba(242,196,107,0.55)" : "inset 0 0 0 2px #5A3820",
      signOpacity: result === "none" ? 0.4 : 1,
      signCaption: result === "none" ? "This is Tom's sketch. Press Run to build yours on top of it." : (puzzled ? "A customer pressed Order" : ""),
      checks: checks,
      checkCount: result === "none" ? "0 of 4" : (puzzled ? "3 of 4" : "4 of 4"),
      consoleLine1: result === "none" ? "A customer will press your buttons here after Run." : "customer › pressed [Order]",
      consoleLine2: result === "none" ? "" : (puzzled ? "(nothing printed)" : "New order!"),
      consoleColor: puzzled ? "#E8A08C" : "#A8D08D",
      shop2: s.phase === "done" ? "#F2C46B" : "#D8C7AE",
      shop2Glow: s.phase === "done" ? "0 0 12px 3px rgba(242,196,107,0.8)" : "none",
      shopsOpen: s.phase === "done" ? "2 of 5 shops open" : "1 of 5 shops open",

      showBig: s.phase === "celebrating",
      bigShown: bigLine.slice(0, Math.floor(s.n)),
      bigBob: bigTalk ? -4 : 0,
      bigMouthOpen: bigTalk ? 1 : 0,
      bigMouthGrin: bigTalk ? 0 : 1,
      pageLabel: (s.page + 1) + " of " + lines.length,
      showArrow: s.phase === "celebrating" && !bigTyping && !isLast,
      arrowOpacity: reduced || s.tick % 20 < 12 ? 1 : 0.3,
      showCta: s.phase === "celebrating" && !bigTyping && isLast,
      advance: () => this.advance(),
      finish: () => this.setState({ phase: "done" })
    };
  }
}

mountDC(Component, {"speed": 40, "reducedMotion": false});
</script>
</body>
</html>
